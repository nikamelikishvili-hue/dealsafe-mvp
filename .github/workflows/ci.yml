name: Quality and security foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v5

      - name: Use the supported Node.js release
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Run type, foundation, and production-build checks
        run: npm run verify

      - name: Report high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
