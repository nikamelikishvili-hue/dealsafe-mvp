name: Quality and security foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v7

      - name: Use the supported Node.js release
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Run type, foundation, and production-build checks
        run: npm run verify

      - name: Report high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Recreate the deterministic CycloneDX dependency inventory
        run: npm run release:sbom

      - name: Create deterministic release evidence
        run: npm run release:evidence
        env:
          DEALIVRA_RELEASE_COMMIT: ${{ github.sha }}

      - name: Retain the reviewed evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: dealivra-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
