name: Staging database authorization gate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Confirm the isolated database target
        required: true
        type: choice
        options:
          - staging

permissions:
  contents: read

concurrency:
  group: staging-database-authorization-gate
  cancel-in-progress: false

jobs:
  authorization-gate:
    name: Staging RLS and cross-user authorization
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      DEALIVRA_DATABASE_ENVIRONMENT: ${{ inputs.target }}
      DEALIVRA_STAGING_SUPABASE_PROJECT_REF: ${{ vars.DEALIVRA_STAGING_SUPABASE_PROJECT_REF }}
      DEALIVRA_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.DEALIVRA_PRODUCTION_SUPABASE_PROJECT_REF }}
      DEALIVRA_STAGING_DATABASE_URL: ${{ secrets.DEALIVRA_STAGING_DATABASE_URL }}
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Use the pinned Node.js release
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Reject Production or mixed database targets
        run: npm run staging:database-target

      - name: Show the PostgreSQL client version
        run: psql --version

      - name: Apply the reviewed private-table RLS migration to Staging
        run: psql "$DEALIVRA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/private_evidence_maintenance_settings_rls.sql

      - name: Verify the database security contract
        run: psql "$DEALIVRA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/database_security_contract_rollback.sql

      - name: Verify participant and role isolation
        run: psql "$DEALIVRA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/authenticated_rpc_cross_role_rollback.sql

      - name: Verify private maintenance settings isolation
        run: psql "$DEALIVRA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/private_evidence_maintenance_settings_rls_rollback.sql
