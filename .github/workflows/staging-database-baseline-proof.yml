name: Staging database baseline proof

on:
  workflow_dispatch:
    inputs:
      target:
        description: Confirm the isolated database target
        required: true
        type: choice
        options:
          - staging

permissions:
  contents: read

concurrency:
  group: staging-database-baseline-proof
  cancel-in-progress: false

jobs:
  baseline-proof:
    name: Capture and rebuild the isolated Staging schema
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      DEALIVRA_DATABASE_ENVIRONMENT: ${{ inputs.target }}
      DEALIVRA_STAGING_SUPABASE_PROJECT_REF: ${{ vars.DEALIVRA_STAGING_SUPABASE_PROJECT_REF }}
      DEALIVRA_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.DEALIVRA_PRODUCTION_SUPABASE_PROJECT_REF }}
      DEALIVRA_STAGING_DATABASE_URL: ${{ secrets.DEALIVRA_STAGING_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEALIVRA_STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEALIVRA_STAGING_SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject Production, mixed, or incomplete database targets
        run: npm run staging:database-target

      - name: Use the pinned Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Confirm the reviewed CLI command surface
        run: |
          supabase --version
          supabase migration new --help
          supabase db dump --help
          supabase db diff --help
          supabase migration list --help
          supabase db reset --help

      - name: Require an uncaptured baseline
        shell: bash
        run: |
          set -euo pipefail
          test ! -d supabase/migrations || test -z "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Link only the isolated Staging project
        run: supabase link --project-ref "$DEALIVRA_STAGING_SUPABASE_PROJECT_REF"

      - name: Capture the CLI-generated Staging baseline
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new dealivra_staging_baseline
          mapfile -t baselines < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql')
          test "${#baselines[@]}" -eq 1
          baseline="${baselines[0]}"
          [[ "$baseline" =~ /[0-9]{14}_dealivra_staging_baseline\.sql$ ]]
          # Schema-only export: never fetch data or repair hosted migration history.
          supabase db dump --linked --file "$baseline"
          test -s "$baseline"
          # Reproduce db pull's second pass for managed schemas and privileges.
          # The diff is applied to a disposable shadow database, never to Staging.
          delta="$(mktemp)"
          trap 'rm -f "$delta"' EXIT
          # pg_dump assumes stock creation ACLs. Supabase's local defaults add
          # API-role grants that its exported object ACLs do not fully revoke.
          # Normalize only future postgres-owned objects before local replay;
          # the dump restores the source default privileges at its end.
          cat > "$delta" <<'SQL'
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON FUNCTIONS FROM anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON SEQUENCES FROM anon, authenticated, service_role;
          SQL
          cat "$baseline" >> "$delta"
          cat "$delta" > "$baseline"
          supabase db diff --linked --use-migra > "$delta"
          printf '\n' >> "$baseline"
          cat "$delta" >> "$baseline"

      - name: Verify the data-free migration manifest
        run: npm run database:baseline:verify

      - name: Report existing Staging history without changing it
        run: supabase migration list --linked

      - name: Retain captured schema for review before database proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dealivra-staging-schema-review-${{ github.sha }}
          path: supabase/migrations/*.sql
          if-no-files-found: error
          retention-days: 7

      - name: Start a disposable local Supabase stack
        id: local_stack
        run: supabase start

      - name: Rebuild the empty local database from migrations
        run: supabase db reset --local

      - name: Bootstrap disposable fixtures and verify all 17 suites locally
        run: npm run database:local:rollback -- --local-disposable

      - name: Verify local fixture rejects missing authorization and reuse
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { createLocalRollbackPlan, runLocalRollbackProof, safeLocalFailure } from './scripts/run-local-database-rollback-proof.mjs';
          const plan = createLocalRollbackPlan({ argv: ['--local-disposable'] });
          const result = spawnSync('psql', [
            '--host=127.0.0.1', '--port=54322', '--username=postgres',
            '--dbname=postgres', '--no-password', '-X', '--quiet',
            '--set=ON_ERROR_STOP=1', '--set=VERBOSITY=verbose',
            `--file=${plan.files[0]}`,
          ], {
            env: { ...plan.env, PGOPTIONS: plan.env.PGOPTIONS.replace('dealivra.local_fixture_bootstrap=on', 'dealivra.local_fixture_bootstrap=off') },
            shell: false, encoding: 'utf8', timeout: 90000, maxBuffer: 1048576,
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          if (result.status === 0 || !safeLocalFailure(result).includes('guard=local-authorization')) {
            throw new Error('Local fixture did not prove rejection of missing authorization.');
          }
          let reuseRejected = false;
          try {
            runLocalRollbackProof({ argv: ['--local-disposable'] });
          } catch (error) {
            reuseRejected = error.message.includes('guard=existing-configuration');
          }
          if (!reuseRejected) throw new Error('Local fixture did not prove rejection of existing state.');
          console.log('Local fixture rejected missing authorization and existing state; both transactions rolled back.');
          JS

      - name: Run local database advisors
        run: supabase db advisors --local

      - name: Upload only the verified baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dealivra-staging-baseline-${{ github.sha }}
          path: supabase/migrations/*.sql
          if-no-files-found: error
          retention-days: 7

      - name: Stop the disposable local stack
        if: ${{ always() && steps.local_stack.outcome == 'success' }}
        run: supabase stop --no-backup
